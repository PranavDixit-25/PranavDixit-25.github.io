<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, follow" />
        <meta name="theme-color" content="#00040e" />
        <title>Page not found | Pranav Dixit — Code &amp; Cognition</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <style>
            :root {
                color-scheme: dark;
                font-family: system-ui, -apple-system, sans-serif;
                background: #00040e;
                color: #edf8ff;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.15), transparent 38rem),
                    radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12), transparent 32rem),
                    #00040e;
            }

            main {
                width: min(38rem, calc(100% - 2.5rem));
                text-align: center;
                padding: 2rem;
            }

            .eyebrow {
                color: #06b6d4;
                font-size: 0.82rem;
                font-weight: 700;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                margin-bottom: 0.5rem;
            }

            h1 {
                margin: 0.5rem 0 1rem;
                font-size: clamp(2.4rem, 8vw, 4.2rem);
                letter-spacing: -0.04em;
                line-height: 1.1;
                font-weight: 300;
            }

            p {
                color: #94a3b8;
                font-size: 1.1rem;
                line-height: 1.65;
                margin: 0 auto 2rem;
                max-width: 28rem;
            }

            nav {
                margin-top: 2rem;
            }

            a {
                display: inline-block;
                padding: 0.8rem 1.8rem;
                border: 1px solid rgba(59, 130, 246, 0.4);
                border-radius: 999px;
                color: #edf8ff;
                text-decoration: none;
                font-weight: 500;
                font-size: 0.95rem;
                background: rgba(59, 130, 246, 0.08);
                transition: all 0.2s ease;
            }

            a:hover,
            a:focus-visible {
                border-color: #3b82f6;
                color: #fff;
                background: rgba(59, 130, 246, 0.2);
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
                outline: none;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="eyebrow">404 — Cosmic Void</p>
            <h1>Coordinates Drifted Out of Range</h1>
            <p>The stellar address you requested does not match an active route on this site.</p>

            <nav aria-label="Recovery">
                <a href="/">Return to Orbit (Homepage)</a>
            </nav>
        </main>
    </body>
</html>
